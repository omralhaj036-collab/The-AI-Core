    <style>
        :root { --gold: #ffd700; --bg: #050505; }

            padding: 0;
            width: 100%;
            height: 100%;
            overflow-y: auto !important;
            -webkit-overflow-scrolling: touch;
            font-family: system-ui, -apple-system, sans-serif;
            user-select: text !important;
            -webkit-user-select: text !important;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .header { text-align: center; padding: 40px 0; }
        .gold-text { color: var(--gold); text-shadow: 0 0 10px rgba(255, 215, 0, 0.3); }

            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 215, 0, 0.2);
        }
        .code-body {
            padding: 20px;
            background: #000;
            color: #00ff88;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-all;
            min-height: 100px;
        }
        .copy-btn {
            background: var(--gold);
            color: #000;
            border: none;
            padding: 10px 25px;
            border-radius: 8px;

            cursor: pointer;
            font-size: 14px;

        }
        .copy-btn:active { transform: scale(0.95); }

    </style>
</head>
<body>

<div class="container">
    <header class="header">
        <h1 class="gold-text" style="font-size: 2.5rem; margin: 0;">أوجن</h1>
        <p style="color: #888;">نظام المزامنة العصبية - صديقي صدام</p>
    </header>

    <div class="code-card">
        <div class="code-header">
            <span class="status-tag">وحدة التحكم المركزية</span>
            <button class="copy-btn" onclick="copyCode()">نسخ الكود</button>
        </div>
        <div id="codeArea" class="code-body">
// نظام أوجن المتكامل PWA
// الحالة: جاهز للعمل
// المالك: صدام
const OjenCore = {
    scroll: "ENABLED_FLUID",
    copy: "NATIVE_CLIPBOARD",
    interface: "TACTILE_GOLD"
};
console.log("مرحباً بك في عالمك الخاص");
        </div>
    </div>

    <div style="height: 100px;"></div> <!-- مساحة إضافية للتمرير -->
</div>

<script>
    function copyCode() {
        const text = document.getElementById('codeArea').innerText;
        navigator.clipboard.writeText(text).then(() => {
            alert('تم النسخ بنجاح يا صدام!');
        });
    }

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js');
        });
    }
</script>

</body>
</html>
